<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque — Livres numériques</title>
  <style>
    :root { color-scheme: light; --bg: oklch(0.98 0.008 90); --text: oklch(0.23 0.012 160); --accent: oklch(0.35 0.077 160); --line: oklch(0.83 0.015 160); }
    [data-theme="dark"] { color-scheme: dark; --bg: oklch(0.2 0.008 160); --text: oklch(0.91 0.008 90); --accent: oklch(0.82 0.08 160); --line: oklch(0.4 0.015 160); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1.2rem/1.6 Georgia, "Times New Roman", serif; }
    main { max-width: 600px; margin: auto; padding: 3rem 1rem; }
    h1, h2 { font-family: "Segoe UI", "Helvetica Neue", sans-serif; line-height: 1.3; }
    h1 { font-size: 2rem; margin: 0 0 .75rem; }
    header p { margin: 0 0 2.5rem; }
    .settings { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
    button { font: 1rem/1.4 "Segoe UI", sans-serif; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: .3rem; padding: .6rem .9rem; min-height: 44px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 1.5rem 0; border-block: 1px solid var(--line); }
    h2 { font-size: 1.5rem; margin: 0 0 .5rem; }
    li p { margin: .35rem 0; }
    .author { font-size: 1rem; }
    a { color: var(--accent); text-underline-offset: .2em; }
    .read { display: inline-block; margin-top: 1rem; padding: .65rem 1.1rem; background: oklch(0.35 0.077 160); color: oklch(0.98 0.008 90); border-radius: .4rem; text-decoration: none; font: 1rem/1.6 "Segoe UI", sans-serif; min-height: 44px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .read:hover { background: oklch(0.29 0.077 160); }
  </style>
  <script>
    try {
      const theme = localStorage.getItem('ebooks-theme') || localStorage.getItem('mises-pe-pmtv-theme');
      document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <main>
    <div class="settings"><button id="toggle-theme" type="button" aria-label="Activer le mode sombre" aria-pressed="false">Mode sombre</button></div>
    <header>
      <h1>Bibliothèque</h1>
      <p>Des livres à lire, à votre rythme.</p>
    </header>
    <ul aria-label="Livres disponibles">
      <!-- Ajouter chaque prochain livre dans un nouvel élément li. -->
      <li>
        <h2><a href="Mises - Politique économique.html">Politique économique</a></h2>
        <p>Réflexions pour aujourd’hui et pour demain</p>
        <p class="author">Ludwig von Mises · Traduction de Raoul Audouin</p>
        <a class="read" href="Mises - Politique économique.html">Lire le livre →</a>
      </li>
    </ul>
  </main>
  <script>
    const themeButton = document.getElementById('toggle-theme');
    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === 'dark';
      themeButton.textContent = dark ? 'Mode clair' : 'Mode sombre';
      themeButton.setAttribute('aria-label', dark ? 'Activer le mode clair' : 'Activer le mode sombre');
      themeButton.setAttribute('aria-pressed', String(dark));
    }
    updateThemeButton();
    themeButton.addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('ebooks-theme', theme); } catch (e) {}
      updateThemeButton();
    });
    addEventListener('pageshow', () => {
      try {
        const theme = localStorage.getItem('ebooks-theme');
        if (theme) document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
      } catch (e) {}
      updateThemeButton();
    });
  </script>
</body>
</html>
